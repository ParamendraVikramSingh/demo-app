[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /app/logs/app.log,/app/logs/access.log
    Tag               demo.logs
    Parser            json_logs
    DB                /fluent-bit/state/flb.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[FILTER]
    Name              modify
    Match             demo.logs
    Add               ingested_by fluent-bit
    Add               service chatcommerce-api
    Add               environment development

[OUTPUT]
    Name              es
    Match             demo.logs
    Host              host.docker.internal
    Port              9200
    Index             demo-logs
    Logstash_Format   On
    Logstash_Prefix   demo-logs
    Retry_Limit       False
    Suppress_Type_Name On
